# Golden Hour on a single server: the app plus Caddy for automatic HTTPS.
services:
  app:
    build: ../..
    restart: unless-stopped
    env_file: .env.production          # OPENROUTER_API_KEY etc. — created on the server, never committed
    environment:
      TRUSTED_PROXY_HOPS: "1"          # Caddy sits in front
      TRACE_BUDGET_SECONDS: "150"
    expose: ["3000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
